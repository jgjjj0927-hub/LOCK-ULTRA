# language: yaml, file: .github/workflows/build.yml — MSVC на windows-latest
name: build-lab-exe
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          cl /nologo /EHsc /std:c++17 /O2 /MT `
             /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN `
             src\main.cpp src\browser.cpp src\video.cpp src\bsod.cpp src\inject.cpp `
             /link /SUBSYSTEM:WINDOWS `
             mfplat.lib mfuuid.lib ole32.lib user32.lib gdi32.lib advapi32.lib psapi.lib `
             /OUT:lab.exe

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: lab-exe
          path: lab.exe
